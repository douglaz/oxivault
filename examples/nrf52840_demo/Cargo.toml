[package]
name = "nrf52840-demo"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "nrf52840-demo"
path = "src/main.rs"

[dependencies]
oxivault-core = { path = "../../oxivault-core", default-features = false }
oxivault-embedded = { path = "../../oxivault-embedded", features = ["nrf52840"] }

embassy-executor = { version = "0.6", default-features = false, features = ["arch-cortex-m", "executor-thread", "integrated-timers"] }
embassy-time = { version = "0.3", default-features = false }
embassy-nrf = { version = "0.2", default-features = false, features = ["nrf52840", "time-driver-rtc1", "gpiote"] }

cortex-m = { version = "0.7" }
cortex-m-rt = { version = "0.7" }
defmt = "0.3"
defmt-rtt = "0.4"
panic-probe = { version = "0.3", features = ["print-defmt"] }

heapless = "0.8"

[profile.release]
debug = 2
lto = true
opt-level = "z"