[package]
name = "oxivault-embedded"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
oxivault-core = { path = "../oxivault-core", default-features = false }
oxivault-qr = { path = "../oxivault-qr", default-features = false }
bitcoin = { workspace = true }

embassy-executor = { workspace = true }
embassy-time = { workspace = true }
embassy-sync = { workspace = true }
embedded-hal = { workspace = true }
embedded-hal-async = { workspace = true }
heapless = { workspace = true }
defmt = { workspace = true }
defmt-rtt = { workspace = true }
panic-probe = { workspace = true }
embedded-graphics-core = { version = "0.4", default-features = false }

# Platform-specific dependencies (choose one when building)
embassy-nrf = { version = "0.2", optional = true, default-features = false, features = ["nrf52840", "time-driver-rtc1", "gpiote", "unstable-pac"] }
embassy-stm32 = { version = "0.1", optional = true, default-features = false }
embassy-rp = { version = "0.2", optional = true, default-features = false, features = ["unstable-pac", "time-driver"] }
esp-hal = { version = "0.22", optional = true, default-features = false }
cortex-m = { version = "0.7", optional = true }
cortex-m-rt = { version = "0.7", optional = true }

[features]
default = []
nrf52840 = ["embassy-nrf", "cortex-m", "cortex-m-rt"]
stm32l4 = ["embassy-stm32", "cortex-m", "cortex-m-rt"]
rp2040 = ["embassy-rp", "cortex-m", "cortex-m-rt"]
esp32c3 = ["esp-hal"]

[lib]
name = "oxivault_embedded"