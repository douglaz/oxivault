[workspace]
resolver = "2"
members = [
    "ironvault-core",
    "ironvault-embedded", 
    "ironvault-simulator",
    "ironvault-qr",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["IronVault Contributors"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/yourusername/ironvault"

[workspace.dependencies]
# Bitcoin libraries
bitcoin = { version = "0.32", default-features = false }
secp256k1 = { version = "0.29", default-features = false }
bip39 = { version = "2.1", default-features = false }

# Embedded dependencies
embassy-executor = { version = "0.6", default-features = false }
embassy-time = { version = "0.3", default-features = false }
embassy-sync = { version = "0.6", default-features = false }

# Core dependencies
heapless = "0.8"
nb = "1.1"
embedded-hal = "1.0"
embedded-hal-async = "1.0"
defmt = "0.3"
defmt-rtt = "0.4"
panic-probe = { version = "0.3", features = ["print-defmt"] }

# QR code dependencies
qrcode = { version = "0.14", default-features = false }

# Crypto
sha2 = { version = "0.10", default-features = false }
ripemd = { version = "0.1", default-features = false }
zeroize = { version = "1.7", default-features = false, features = ["derive"] }
subtle = { version = "2.5", default-features = false }

# Serialization
serde = { version = "1.0", default-features = false, features = ["derive"] }
serde_json = { version = "1.0", default-features = false, features = ["alloc"] }

[profile.release]
codegen-units = 1
debug = false  # Remove debug symbols for smaller binary
debug-assertions = false
incremental = false
lto = "fat"  # Full link-time optimization
opt-level = "z"  # Optimize for size
overflow-checks = false
strip = true  # Strip symbols from binary
panic = "abort"  # Smaller panic handler

[profile.release.build-override]
codegen-units = 1
debug = false
debug-assertions = false
incremental = false
opt-level = "z"
overflow-checks = false