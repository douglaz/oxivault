name: CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install Nix
      uses: cachix/install-nix-action@v31
      with:
        nix_path: nixpkgs=channel:nixos-unstable
        extra_nix_config: |
          experimental-features = nix-command flakes
    
    # Cache cargo registry (dependencies), not target directory
    # Target caching conflicts with nix environment and multiple build targets
    - name: Cache Cargo registry
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
        key: cargo-registry-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          cargo-registry-${{ runner.os }}-
    
    - name: Check formatting
      run: nix develop -c cargo fmt --all -- --check
    
    - name: Run linting
      run: nix develop -c cargo clippy --all --all-features -- -D warnings
    
    - name: Build all packages
      run: nix develop -c cargo build --all --verbose
    
    - name: Build core (no_std)
      run: nix develop -c cargo build --package oxivault-core --no-default-features
    
    - name: Run all tests
      run: nix develop -c cargo test --all --verbose
    
    - name: Build documentation
      run: nix develop -c cargo doc --all --no-deps
    
    - name: Test documentation examples
      run: nix develop -c cargo test --doc --all

