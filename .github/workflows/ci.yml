  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install Nix
      uses: cachix/install-nix-action@v31
      with:
        nix_path: nixpkgs=channel:nixos-unstable
        extra_nix_config: |
          experimental-features = nix-command flakes
    
    - name: Install cargo-audit
      run: nix develop -c cargo install cargo-audit
    
    - name: Run security audit
      run: nix develop -c cargo audit

  nix-build:
    name: Nix Package Build
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install Nix
      uses: cachix/install-nix-action@v31
      with:
        nix_path: nixpkgs=channel:nixos-unstable
        extra_nix_config: |
          experimental-features = nix-command flakes
    
    - name: Build default package (simulator)
      run: nix build
    
    - name: Build core package (no_std verification)
      run: nix build .#oxivault-core
    
    - name: Check flake
      run: nix flake check

  release:
    name: Release Build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    needs: [build-and-test, security-audit, nix-build]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install Nix
      uses: cachix/install-nix-action@v31
      with:
        nix_path: nixpkgs=channel:nixos-unstable
        extra_nix_config: |
          experimental-features = nix-command flakes
    
    - name: Build release binary
      run: nix develop -c cargo build --release --package oxivault-simulator
    
    - name: Check binary size
      run: |
        SIZE=$(ls -lh target/release/oxivault-sim | awk '{print $5}')
        echo "Binary size: $SIZE"
        echo "::notice title=Binary Size::Release binary size is $SIZE"
    
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: oxivault-sim-${{ github.sha }}
        path: target/release/oxivault-sim